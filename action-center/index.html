<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Hub has moved</title>
    <link rel="canonical" href="https://meta-ltv-dashboard.pages.dev/action-center/" />
    <meta name="robots" content="noindex" />
    <!--
      The Creative Hub now ships from the ltv-cac-dashboard repo and is served by
      Cloudflare Pages. This copy is retired so the Hub exists at exactly one URL
      and cannot drift between two deployments again.

      IMPORTANT FOR WHOEVER DEPLOYS THE HUB: a new Manus build dropped in here
      will overwrite this file and quietly bring the old URL back to life.
      Publish to the ltv-cac-dashboard repo instead:
        https://github.com/The-Pour-Over/ltv-cac-dashboard
        -> action-center/  (committing there deploys automatically)
    -->
    <meta http-equiv="refresh" content="0; url=https://meta-ltv-dashboard.pages.dev/action-center/" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #faf8f5; color: #3d3428; text-align: center; padding: 24px;
        font-family: "DM Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1c1917; color: #eadfd3; }
      }
      h1 { font-size: 1.35rem; margin: 0 0 12px; font-weight: 600; }
      p { margin: 0 0 20px; opacity: 0.75; line-height: 1.5; }
      a {
        display: inline-block; padding: 11px 20px; border-radius: 8px;
        background: #16a34a; color: #fff; text-decoration: none; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The Creative Hub has moved</h1>
      <p>
        It now lives on the LTV/CAC dashboard.<br />
        Redirecting you there — update your bookmark.
      </p>
      <a href="https://meta-ltv-dashboard.pages.dev/action-center/">Open the Creative Hub</a>
    </main>
  </body>
</html>
