name: Monthly beehiiv Data Update

on:
  schedule:
    - cron: '0 8 1 * *'   # 8am UTC on the 1st of every month
  workflow_dispatch:        # also allows manual trigger from GitHub

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run data update
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
        run: python update_data.py

      - name: Commit & push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: monthly beehiiv data refresh $(date +'%B %Y')"
          git push
